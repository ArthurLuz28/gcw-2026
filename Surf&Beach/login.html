<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="body-login">

    <div class="card-login">

        <div class="login-header">
            <h2>Entrar</h2>
            <a href="index.html" style="text-decoration: none; color: inherit;">
                <i data-lucide="x" class="icon-close"></i>
            </a>
        </div>

        <div class="login-tabs">
            <button class="tab active">Login</button>
            <button class="tab" onclick="window.location.href='register.html'">Registrar</button>
        </div>

        <div class="login-form">

            <div class="mb-4">
                <label class="form-label">E-mail</label>

                <div class="input-group-custom">
                    <i data-lucide="mail" class="input-icon"></i>

                    <input
                        type="email"
                        class="form-control"
                        placeholder="seu@email.com">
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label">Senha</label>

                <div class="input-group-custom">
                    <i data-lucide="lock" class="input-icon"></i>

                    <input
                        type="password"
                        class="form-control"
                        placeholder="••••••••">
                </div>
            </div>

            <div class="login-options">

                <div class="remember">
                    <input type="checkbox">
                    <span>Lembrar de mim</span>
                </div>

                <a href="#">Esqueceu a senha?</a>

            </div>

            <button class="btn-login" onclick="window.location.href='index.html'">
                Entrar
            </button>

            <div class="divider">
                <span>ou continue com</span>
            </div>

            <div class="social-buttons">

                <button class="social-btn">
                    <i class="fa-brands fa-google"></i>
                    Google
                </button>

                <button class="social-btn">
                    <i class="fa-brands fa-facebook"></i>
                    Facebook
                </button>

            </div>

        </div>

    </div>

    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        lucide.createIcons();
    </script>

</body>

</html>
