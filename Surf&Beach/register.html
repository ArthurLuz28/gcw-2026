<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="body-login">

    <div class="card-login">

        <div class="login-header">
            <h2>Entrar</h2>
            <a href="index.html" style="text-decoration: none; color: inherit;">
                <i data-lucide="x" class="icon-close"></i>
            </a>
        </div>

        <div class="login-tabs">
            <button class="tab" onclick="window.location.href='login.html'">Login</button>
            <button class="tab active">Registrar</button>
        </div>

        <div class="login-form">

            <label class="form-label">Foto de Perfil</label>

            <div class="profile-upload">

                <div class="profile-avatar">
                    <img src="img/template-perfil.jpg" alt="Perfil">
                </div>

                <button type="button" class="upload-btn">
                    <i data-lucide="upload"></i>
                    Escolher Foto
                </button>

            </div>

            <div class="mb-4">
                <label class="form-label">Nome de Exibição</label>

                <div class="input-group-custom">
                    <i data-lucide="user" class="input-icon"></i>

                    <input
                        type="text"
                        class="form-control"
                        placeholder="Como você quer ser chamado?">
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label">E-mail</label>

                <div class="input-group-custom">
                    <i data-lucide="mail" class="input-icon"></i>

                    <input
                        type="email"
                        class="form-control"
                        placeholder="seu@email.com">
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label">Senha</label>

                <div class="input-group-custom">
                    <i data-lucide="lock" class="input-icon"></i>

                    <input
                        type="password"
                        class="form-control"
                        placeholder="Mínimo 6 caracteres">
                </div>
            </div>

            <div class="terms-box">
                Ao criar uma conta, você concorda com nossos
                Termos de Uso e Política de Privacidade.
            </div>

            <button class="btn-login" onclick="window.location.href='login.html'">
                Criar Conta
            </button>

        </div>

    </div>

    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        lucide.createIcons();
    </script>

</body>

</html>
